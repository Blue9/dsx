[package]
name = "dsx"
version = "0.1.0"
edition = "2021"
description = "Minimal DualSense-to-XInput bridge: reads a PS5 controller over HID and feeds a virtual Xbox 360 pad via ViGEmBus."
license = "MIT"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }

[profile.release]
strip = true
